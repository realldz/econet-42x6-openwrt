name: lint

# Cheap checks that catch the classes of mistake this repository is actually
# prone to: CRLF line endings destroying a patch file, a malformed unified diff,
# a shell or Python file that does not even parse.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: Python syntax
        run: |
          set -e
          # `cmd && echo` inside a while loop does NOT fail the step: `set -e`
          # ignores a command that is part of a && list unless it is the last
          # one.  Collect failures and exit on them explicitly instead.
          fail=0
          while IFS= read -r f; do
            if python3 -m py_compile "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(git ls-files '*.py')
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          exit $fail

      - name: Workflows are valid, and so is the shell inside them
        run: |
          set -e
          # A typo in a workflow is not reported until the workflow runs, and one
          # run of the build costs 2-3 hours.  This also runs `bash -n` over every
          # `run:` block, so an unclosed `if` in a step full of heredocs is caught
          # here instead of after the build.
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tools/check_workflows.py .

      - name: The package publisher behaves as documented
        run: |
          set -e
          # scripts/publish-packages.sh writes the directory other people point
          # apk at, and it runs in CI straight after a two-hour build.  This
          # exercises its failure paths and the layout it produces in seconds,
          # without needing an OpenWrt tree.
          PYTHON=python3 tools/test_publish_packages.sh

      - name: The config seeding helpers behave as the gate expects
        run: |
          set -e
          # build-firmware.sh clears CONFIG_TARGET_ROOTFS_INITRAMFS for
          # --no-initramfs, and the check after `make defconfig` greps for the
          # exact line it wrote.  If those two spellings ever disagree the build
          # stops with a complaint about a symbol it had just written itself --
          # and the stale `=y` this replaced is what produced a 12 MB sysupgrade
          # image (docs/sysupgrade.md).  It runs in under a second and needs no
          # OpenWrt tree.
          tools/test_build_firmware.sh

      - name: The Kconfig source checker names dangling sources
        run: |
          # It exists because two patch series sources reached a release build --
          # net/Kconfig sourcing net/xpon/Kconfig and drivers/net/Kconfig sourcing
          # drivers/net/optical/Kconfig, both community-only -- and kconfig stopped on
          # the first of them twenty seconds into the kernel's configure step, after
          # the toolchain had been built, with no reason in the log.  A checker that
          # misses one is worse than none, and one that reports the kernel's own
          # `source "arch/$(SRCARCH)/Kconfig"` is noise that hides the real hit.
          PYTHON=python3 tools/test_check_kernel_sources.sh

      - name: The kmod selection checker fails on what is absent
        run: |
          set -e
          # The archive a release publishes can only hold the modules that build
          # selected.  MEASURED: v0.1.0-m2 published 46 kernel modules and no
          # kmod-wireguard, so `apk add --allow-untrusted kmod-wireguard` 404s
          # from a repository that was built exactly as asked.  check_kmods.py is
          # what turns that into a one-minute CI failure instead of a user
          # finding out.  This exercises it against fake trees, including the two
          # mistakes the first draft made: counting
          # `# CONFIG_PACKAGE_kmod-wireguard is not set` as selected, and looking
          # for the kernel symbol in the target config, where it must not be --
          # scripts/package-metadata.pl writes it into .config.override during
          # `make target/linux/compile` instead.
          PYTHON=python3 tools/test_check_kmods.sh

      - name: The flash-identity checker fails on what is absent
        run: |
          set -e
          # Every MAC on this board now comes from one variable of the U-Boot
          # environment at 0x7C000, read in the kernel, so there is no boot-time
          # script that could patch an address in afterwards.  MEASURED on
          # v0.1.0-m2 and v0.1.1-m2: an image missing that wiring comes up with a
          # random address on eth0 and 00:00:00:00:00:00 on the LAN ports and both
          # radios, and the only symptom is a boot log line nobody reads.
          # check_dts_mac.py names the mistake and the arithmetic; this exercises
          # it against 13 planted ones, on a copy of the real DTS and real patch.
          PYTHON=python3 tools/test_check_dts_mac.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # advisory only: these scripts are written for bash, not POSIX sh
          shellcheck --shell=bash --severity=warning $(git ls-files '*.sh') || true

      - name: Patch hunk headers match their bodies
        run: |
          set -e
          # `git apply --stat` is NOT enough.  When a hunk header under-counts,
          # git reads only as many body lines as the header promised and exits
          # 0 for the leftover -- it reported 49 insertions for a 52-line body
          # and said nothing.  The patch then applies "cleanly" while silently
          # dropping the tail of the hunk: that is how CONFIG_I2C_MT7621=y, the
          # line that makes the I2C controller exist, went missing while every
          # check stayed green.  check_patches.py counts the body and names the
          # hunk, instead of only checking that the file parses.
          mapfile -t patches < <(git ls-files '*.patch')
          python3 tools/check_patches.py "${patches[@]}"

      - name: The patch series applies to the pinned tree
        run: |
          set -e
          # Well-formed is not the same as applicable.  A hunk can have correct
          # counts and context lines that are all present in a clean tree and still
          # be refused by `git apply` -- 0006 was exactly that -- because a patch
          # written in a tree that had already drifted carries that tree's line
          # numbers and block positions, not only its text.  Everything the series
          # touches is public, so fetch it at the pin and replay the series the way
          # apply-overlay.sh does, in order.  This is the check that would have
          # saved the second CI run; it takes about ten seconds.
          python3 tools/check_patches_apply.py

      - name: The patch-appliance gate refuses a patch that cannot apply
        run: |
          set -e
          # A gate that always prints "the series applies" is worse than no gate:
          # it would have said that about the series that failed CI.  This plants a
          # patch that cannot apply and checks that the gate refuses it, by name.
          PYTHON=python3 tools/test_check_patches_apply.sh

      - name: Patches are well-formed unified diffs
        run: |
          set -e
          fail=0
          while IFS= read -r p; do
            if git apply --stat "$p" >/dev/null; then
              echo "ok   $p"
            else
              echo "FAIL $p"
              fail=1
            fi
          done < <(git ls-files '*.patch')
          exit $fail

      - name: Patches carry no whitespace damage
        run: |
          set -e
          # A trailing space on a context line is invisible and legal, but a
          # context line that lost its leading space is not: git then reads it
          # as a new header.  `--check` reports that as "corrupt patch".
          mapfile -t patches < <(git ls-files '*.patch')
          fail=0
          for p in "${patches[@]}"; do
            # Files the patch targets do not exist in this repo, so a
            # "No such file or directory" is expected; a parse error is not.
            out=$(git apply --check "$p" 2>&1 || true)
            if grep -q 'corrupt patch' <<<"$out"; then
              echo "FAIL $p"
              echo "$out"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "ok: every patch parses as a unified diff"
          exit $fail

      - name: No CRLF line endings
        run: |
          set -e
          if git grep -lI $'\r$' -- . >/dev/null 2>&1; then
            echo "!! files contain CRLF line endings:"
            git grep -lI $'\r$' -- .
            exit 1
          fi
          echo "ok: all files are LF"

      - name: Report non-ASCII files (advisory)
        run: |
          # Advisory only.  The board-support sources carry a few Vietnamese
          # comments and the odd emoji, which is fine -- what this must catch is
          # an *encoding* accident, such as a UTF-8 comment pasted into a file
          # that git then normalises, or a stray BOM.  It scans every tracked
          # file rather than a list of extensions: that list missed the three
          # nested Makefiles of the diagnostic modules, LICENSE, .gitattributes
          # and every .c file, which is exactly where this would hide.
          while IFS= read -r f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              echo "non-ASCII: $f"
              LC_ALL=C grep -nP '[^\x00-\x7F]' "$f" | head -3
            fi
          done < <(git ls-files)
