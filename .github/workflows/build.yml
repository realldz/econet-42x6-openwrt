name: build

# One firmware build, from a clean OpenWrt tree, with a verification gate.
#
# This is a full OpenWrt source build: expect roughly 2-3 hours on a GitHub
# runner.  It is written as a reusable workflow so release.yml can call it twice
# (once per image kind) instead of duplicating the whole sequence.
#
# Why one image kind per run: the persistent image must NOT carry a kernel with
# the initramfs embedded in it.  Toggling CONFIG_TARGET_ROOTFS_INITRAMFS changes
# the kernel, so the two images cannot come out of one build -- measured, the
# sysupgrade image of a build that had the initramfs in the kernel was
# 12,058,913 B with the squashfs at 0x760000, against 9,437,473 B with the
# squashfs at 0x3A0000 without it.  A sysupgrade image whose squashfs sits past
# mtd4 (0x3A0000) cannot be split correctly.  Two jobs on two runners also keeps
# the wall-clock time at one build instead of two back-to-back.
#
# Called by: release.yml
# Manual use: Actions -> build -> Run workflow (dev builds, nothing is published)

on:
  workflow_call:
    inputs:
      variant:
        description: 'package variant: m2 (Ethernet + Wi-Fi + LuCI + apk) or full (adds optical/xPON/OMCI)'
        required: false
        type: string
        default: m2
      images:
        description: 'which image kind this run produces'
        required: false
        type: string
        default: initramfs
      imagebuilder:
        description: 'also build the self-contained Image Builder tarball'
        required: false
        type: boolean
        default: false
      upload:
        description: 'upload images as a workflow artifact'
        required: false
        type: boolean
        default: true
      tag:
        description: 'release tag the package repository is keyed to (empty = dev-<sha>)'
        required: false
        type: string
        default: ''
      feeds:
        description: 'also publish the userspace apk feeds, not just the kernel modules'
        required: false
        type: boolean
        default: false
      kmods:
        description: "extra kernel modules to build and publish: 'all', a comma-separated list of packages, or 'image' for only what the image needs"
        required: false
        type: string
        default: image
    outputs:
      commit:
        description: 'the OpenWrt revision that was built'
        value: ${{ jobs.firmware.outputs.commit }}
      variant:
        description: 'the package variant that was built'
        value: ${{ jobs.firmware.outputs.variant }}
      images:
        description: 'the image kind that was built'
        value: ${{ jobs.firmware.outputs.images }}

  workflow_dispatch:
    inputs:
      variant:
        description: 'package variant'
        type: choice
        options: [m2, full]
        default: m2
      images:
        description: 'which image kind to produce'
        type: choice
        options: [initramfs, sysupgrade]
        default: initramfs
      imagebuilder:
        description: 'also build the Image Builder tarball'
        type: boolean
        default: false
      upload:
        description: 'upload images as a workflow artifact'
        type: boolean
        default: true
      tag:
        description: 'release tag the package repository is keyed to (empty = dev-<sha>)'
        type: string
        default: ''
      feeds:
        description: 'also publish the userspace apk feeds'
        type: boolean
        default: false
      kmods:
        description: "extra kernel modules: 'all', a comma-separated list, or 'image'"
        type: string
        default: image

permissions:
  contents: read

jobs:
  firmware:
    # Pinned, not ubuntu-latest.  GitHub announced on 2026-10-14 that the label
    # moves to Ubuntu 26 on 2026-10-19; a build here takes two and a half hours and
    # a host distribution that changes the compiler or the autotools underneath it
    # is a failure nobody would connect to the runner.  When the label moves on,
    # this changes deliberately, in its own commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      variant: ${{ inputs.variant }}
      images: ${{ inputs.images }}
      tag: ${{ steps.meta.outputs.tag }}

    # The OpenWrt tree is fetched OUTSIDE the checked-out workspace, and that is
    # not a style choice: this repository contains a top-level directory called
    # `openwrt/` (the board support), so `git clone ... openwrt` inside the
    # checkout dies with
    #     fatal: destination path 'openwrt' already exists and is not an empty directory
    # which is how the first run of this workflow failed, before it built anything.
    #
    # `github.workspace` and not `runner.temp`: a job-level `env:` may only use the
    # github, needs, strategy, matrix, vars, secrets and inputs contexts.  `runner`
    # is allowed in a step's `env:` and `with:` and not here, and writing it here
    # made GitHub reject the whole file -- the push produced no jobs at all, just
    # "This run likely failed because of a workflow file issue".  tools/
    # check_workflows.py now knows this table and refuses the file locally.
    # Inside the workspace, but not the repository's own openwrt/ directory, which
    # scripts/apply-overlay.sh copies into and this clone would collide with.  It is
    # gitignored.  The tree used to sit beside the workspace
    # (`${{ github.workspace }}/../owrt-build`), and upload-artifact refuses to read
    # such a path -- "Invalid pattern ... Relative pathing '.' and '..' is not
    # allowed" -- so the step whose whole purpose is to publish the build logs failed
    # instead, on the one run whose logs mattered.
    env:
      OWRT_DIR: ${{ github.workspace }}/owrt-build

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned OpenWrt revision
        id: pin
        run: |
          set -e
          . scripts/pin.env
          echo "commit=$OPENWRT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pinned revision: $OPENWRT_COMMIT ($OPENWRT_COMMIT_DATE)"

      - name: Work out the tag and artifact names
        id: meta
        env:
          # Inputs can be absent (a tag push calls this workflow with defaults
          # only), so they are passed through the environment rather than
          # interpolated, and defaulted here.
          IN_TAG: ${{ inputs.tag }}
          IN_VARIANT: ${{ inputs.variant }}
          IN_IMAGES: ${{ inputs.images }}
        run: |
          set -e
          tag="${IN_TAG:-dev-${GITHUB_SHA::7}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact=airoha-en7523-${IN_IMAGES}-${IN_VARIANT}" >> "$GITHUB_OUTPUT"
          echo "variant=$IN_VARIANT images=$IN_IMAGES tag=$tag"

      # An OpenWrt build needs roughly 30 GB. A stock GitHub runner has about
      # 14 GB free, so this is not optional.
      - name: Free disk space
        run: |
          set -e
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h / | tail -1

      # Retried on purpose: two of these run at once (release.yml calls this
      # workflow twice), and a transient failure here is cheap to retry and
      # expensive to lose -- the same run failing cost nothing but the first run
      # of this workflow proved that a plain `git clone` is a single point of
      # failure for a 2-3 hour job.
      - name: Fetch OpenWrt at the pinned revision
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -e
          . scripts/pin.env
          df -h / | tail -1
          rm -rf "$OWRT_DIR"
          for attempt in 1 2 3; do
            echo "==> git clone attempt $attempt"
            if git clone --filter=blob:none "$OPENWRT_REPO" "$OWRT_DIR"; then
              break
            fi
            rm -rf "$OWRT_DIR"
            if [ "$attempt" = 3 ]; then
              echo "!! could not fetch OpenWrt after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
          git -C "$OWRT_DIR" checkout "$COMMIT"
          git -C "$OWRT_DIR" log -1 --format='%H %ad %s' --date=short

      # Caching the download archive saves the bulk of the network time on
      # repeat builds. staging_dir is deliberately not cached: it is enormous
      # and changes on nearly every build.
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.OWRT_DIR }}/dl
          key: owrt-dl-${{ steps.pin.outputs.commit }}-${{ hashFiles('scripts/pin.env') }}
          restore-keys: |
            owrt-dl-${{ steps.pin.outputs.commit }}-

      - name: Build
        env:
          IN_IMAGES: ${{ inputs.images }}
          IN_VARIANT: ${{ inputs.variant }}
          IN_IB: ${{ inputs.imagebuilder }}
          IN_KMODS: ${{ inputs.kmods }}
        run: |
          set -e
          args=("$OWRT_DIR" --variant "$IN_VARIANT" -j "$(nproc)")
          # Kernel modules beyond the image's own.  The archive published for this
          # release can only hold what this build selects, and airoha/en7523 is
          # FEATURES:=source-only, so there is no OpenWrt feed to fall back on
          # later.  'image' (the default) means do not widen anything.
          if [ -n "${IN_KMODS:-}" ] && [ "$IN_KMODS" != "image" ]; then
            args+=(--kmods "$IN_KMODS")
          fi
          if [ "$IN_IMAGES" = "initramfs" ]; then
            args+=(--initramfs)
          else
            args+=(--no-initramfs)
          fi
          if [ "$IN_IB" = "true" ]; then
            args+=(--imagebuilder)
          fi
          echo "+ ./scripts/build-firmware.sh ${args[*]}"
          ./scripts/build-firmware.sh "${args[@]}"

      # Two different questions, two tools:
      #   verify_build.py  -- does the FIT load the kernel where the kernel thinks
      #                       it is linked?  Getting this wrong deadloops in
      #                       head.S with a silent UART.
      #   verify_image.py  -- does the rootfs start inside the kernel partition?
      #                       This is the one that stops a bad sysupgrade image.
      - name: Verify the images
        env:
          IN_IMAGES: ${{ inputs.images }}
        run: |
          set -e
          shopt -s nullglob
          . scripts/pin.env
          BIN="$OWRT_DIR/$TARGET_BIN"
          if [ "$IN_IMAGES" = "sysupgrade" ]; then
            imgs=("$BIN"/*-sysupgrade.bin)
            [ ${#imgs[@]} -gt 0 ] || { echo "!! the build produced no sysupgrade image"; exit 1; }
            for img in "${imgs[@]}"; do
              python3 tools/verify_build.py "$img"
            done
            # Hard gate: this is the image somebody is about to flash.
            python3 tools/verify_image.py "${imgs[@]}"
          else
            imgs=("$BIN"/*-initramfs-kernel.bin)
            [ ${#imgs[@]} -gt 0 ] || { echo "!! the build produced no initramfs image"; exit 1; }
            for img in "${imgs[@]}"; do
              python3 tools/verify_build.py "$img"
            done
            python3 tools/verify_image.py "${imgs[@]}"
          fi

      - name: Collect the artifacts
        env:
          IN_IMAGES: ${{ inputs.images }}
          IN_IB: ${{ inputs.imagebuilder }}
        run: |
          set -e
          shopt -s nullglob
          . scripts/pin.env
          BIN="$OWRT_DIR/$TARGET_BIN"
          mkdir -p out
          if [ "$IN_IMAGES" = "sysupgrade" ]; then
            # Only the persistent image.  A build that did not ask for an
            # initramfs image should not hand one out by accident either.
            cp -v "$BIN"/*-sysupgrade.bin out/
          else
            cp -v "$BIN"/*-initramfs-kernel.bin out/
          fi
          cp -v "$BIN"/*.manifest out/ 2>/dev/null || true
          if [ "$IN_IB" = "true" ]; then
            # build-firmware.sh --imagebuilder leaves the tarball beside the
            # images; only build-imagebuilder.sh copies it to dist/.  Collecting
            # from dist/ is what made this step fail the first time it ran.
            tarballs=("$BIN"/openwrt-imagebuilder-*.tar.zst)
            [ ${#tarballs[@]} -gt 0 ] || { echo "!! --imagebuilder was requested but $BIN has no tarball"; exit 1; }
            cp -v "${tarballs[@]}" out/
          fi
          cd out
          sha256sum * > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      # The package repository is published per release, keyed to the tag: a
      # kernel module only loads into the kernel it was built against.
      - name: Build the package repository
        if: inputs.images == 'sysupgrade'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IN_FEEDS: ${{ inputs.feeds }}
        run: |
          set -e
          args=("$OWRT_DIR" --tag "$TAG" --out pages)
          if [ "$IN_FEEDS" = "true" ]; then
            args+=(--with-feeds)
          fi
          ./scripts/publish-packages.sh "${args[@]}"

      # The archive is what a user points apk at, so the question here is not
      # "did the build succeed" but "does `apk add kmod-wireguard` work".  A
      # module that was selected and did not reach pages/ is the failure worth
      # stopping for: MEASURED on v0.1.0-m2 without --kmods, the repository was
      # correct in every other way and 46 modules deep, and kmod-wireguard was
      # simply not in it -- which a user sees as a 404.
      - name: The published directory holds the modules it promises
        if: inputs.images == 'sysupgrade' && inputs.kmods != 'image'
        env:
          IN_KMODS: ${{ inputs.kmods }}
        run: |
          set -e
          echo "  kernel modules in pages/: $(find pages \( -name 'kmod-*.apk' -o -name 'kmod-*.ipk' \) | wc -l)"
          for want in $(printf '%s' "$IN_KMODS" | tr ',' ' '); do
            # 'all' promises the modules users ask for by name; kmod-wireguard is
            # the one that was missing, so it is the one worth asserting on.
            [ "$want" = "all" ] && want=kmod-wireguard
            n=$(find pages \( -name "$want-*.apk" -o -name "$want-*.ipk" \) | wc -l)
            echo "  $want: $n file(s) in the published directory"
            if [ "$n" -lt 1 ]; then
              echo "!! $want was selected for the archive but is not in pages/"
              echo "   A module that is not published cannot be installed on the"
              echo "   board, so this release would ship an archive that 404s."
              exit 1
            fi
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ steps.meta.outputs.artifact }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| OpenWrt revision | \`${{ steps.pin.outputs.commit }}\` |"
            echo "| package variant | \`${{ inputs.variant }}\` |"
            echo "| image kind | \`${{ inputs.images }}\` |"
            echo "| kernel modules | \`${{ inputs.kmods }}\` |"
            echo "| tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo
            if [ -f out/SHA256SUMS ]; then
              echo '```'
              cat out/SHA256SUMS
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build logs
        # On failure only: an OpenWrt parallel build keeps each sub-build's output
        # in logs/ rather than the terminal, so this is where the reason for a
        # "target/linux failed to build" is.  build-firmware.sh prints the log of
        # the directory that failed; this uploads all of them, for the case where
        # the failure is somewhere the script did not guess.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.meta.outputs.artifact }}
          path: |
            ${{ env.OWRT_DIR }}/logs/**
            ${{ env.OWRT_DIR }}/.config
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload the images
        if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload the package repository
        if: inputs.images == 'sysupgrade'
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-${{ steps.meta.outputs.tag }}
          path: pages/**
          if-no-files-found: error
          retention-days: 30
