name: kernel patches

# The kernel patch series under openwrt/overlay/ is applied inside the kernel build,
# not by scripts/apply-overlay.sh, so no check that runs on the repository alone can
# see it -- and tools/check_patches_apply.py, which does check openwrt/patches/, is
# blind to it by construction.  Nine patches once modified files this repository does
# not carry, and the first sign of it was "ERROR: target/linux failed to build" forty
# minutes into a two-and-a-half-hour release build.  This job reaches the same point
# in about three minutes: clone, overlay, defconfig, `make target/linux/prepare`.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: kernel-patches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Inside the checkout but not in its openwrt/ directory, which is where this
      # repository keeps the overlay: a clone into that path would collide with it.
      # Beside the workspace does not work either, because upload-artifact refuses
      # any path containing '..' -- see the note in build.yml.
      OWRT_DIR: ${{ github.workspace }}/owrt-kernel-check
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned OpenWrt revision
        id: pin
        run: |
          set -e
          . scripts/pin.env
          echo "commit=$OPENWRT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "OpenWrt $OPENWRT_COMMIT (${OPENWRT_DESCRIBE:-})"

      - name: Fetch OpenWrt at the pinned revision
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -e
          . scripts/pin.env
          rm -rf "$OWRT_DIR"
          for attempt in 1 2 3; do
            echo "==> git clone attempt $attempt"
            if git clone --filter=blob:none "$OPENWRT_REPO" "$OWRT_DIR"; then
              break
            fi
            rm -rf "$OWRT_DIR"
            if [ "$attempt" = 3 ]; then
              echo "!! could not fetch OpenWrt after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
          git -C "$OWRT_DIR" checkout "$COMMIT"
          git -C "$OWRT_DIR" log -1 --format='%H %ad %s' --date=short

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.OWRT_DIR }}/dl
          key: owrt-dl-${{ steps.pin.outputs.commit }}-${{ hashFiles('scripts/pin.env') }}
          restore-keys: |
            owrt-dl-${{ steps.pin.outputs.commit }}-

      - name: The kernel patch series applies
        # --no-packages and --no-feeds: the feeds and the package list have nothing to
        # do with whether the kernel patches apply, and skipping them keeps this job
        # at minutes rather than tens of minutes.  The target symbols are still seeded,
        # so `make defconfig` is the same one the real build uses.
        run: |
          set -e
          # Start from a fresh configuration, as a release build does.  `make
          # defconfig` keeps the values the .config it reads already carries, so a
          # second invocation over the tree the step above configured leaves every
          # kmod symbol at `# CONFIG_PACKAGE_kmod-x is not set` and CONFIG_ALL_KMODS
          # with nothing to promote: MEASURED, run 39218437654, 45 kmod packages =y
          # and 0 =m with the flag present and the seed gate green.  That is what
          # this step exists to catch, and build-firmware.sh now counts the effect
          # itself rather than trusting the flag.
          rm -f "$OWRT_DIR/.config"
          BUILD_TARGET=target/linux/prepare \
            scripts/build-firmware.sh "$OWRT_DIR" --variant m2 --no-packages --no-feeds \
              -j "$(nproc)"

      - name: Every Kconfig source in the prepared kernel resolves
        # Applying is not the same as being consistent.  930-55 and 930-53 applied
        # cleanly and then added `source "net/xpon/Kconfig"` and
        # `source "drivers/net/optical/Kconfig"` to net/Kconfig and drivers/net/Kconfig,
        # and those files only exist in the community airoha_en7523_all branch.  kconfig
        # stopped on the first of them twenty seconds into `make target/linux/compile`,
        # after the toolchain had been built, and the log held no reason: run
        # 38931458568, 38 minutes in.  This checks what kconfig resolves, in a second.
        run: |
          set -e
          python3 tools/check_kernel_sources.py "$OWRT_DIR" --owrt

      - name: An all-kmods configuration really selects the modules it promises
        # The archive published with a release can only hold what that build
        # selected, and this target is FEATURES:=source-only, so there is no
        # OpenWrt kmods feed to fall back on.  MEASURED: v0.1.0-m2 published 46
        # kernel modules and no kmod-wireguard, so `apk add --allow-untrusted
        # kmod-wireguard` against that archive is a 404 from a repository that was
        # built correctly.  CONFIG_ALL_KMODS=y is what fixes it: every non-hidden
        # kmod package then defaults to =m (config/Config-build.in:42,
        # scripts/package-metadata.pl:371-383), which builds and publishes the
        # module without installing it into the image -- and the persistent image
        # has only 0x3A0000 of mtd4 to fit in.  About a minute here; an hour and a
        # half in the release build that gets it wrong.
        run: |
          set -e
          # Start from a fresh configuration, as a release build does.  `make
          # defconfig` keeps the values the .config it reads already carries, so a
          # second invocation over the tree the step above configured leaves every
          # kmod symbol at `# CONFIG_PACKAGE_kmod-x is not set` and CONFIG_ALL_KMODS
          # with nothing to promote: MEASURED, run 39218437654, 45 kmod packages =y
          # and 0 =m with the flag present and the seed gate green.  That is what
          # this step exists to catch, and build-firmware.sh now counts the effect
          # itself rather than trusting the flag.
          rm -f "$OWRT_DIR/.config"
          BUILD_TARGET=target/linux/prepare \
            scripts/build-firmware.sh "$OWRT_DIR" --variant m2 --no-packages --no-feeds \
              --kmods all -j "$(nproc)"
          python3 tools/check_kmods.py "$OWRT_DIR" \
            --require-all-kmods \
            --require-package kmod-wireguard \
            --require-built kmod-wireguard \
            --require-package kmod-udptunnel4 \
            --min-kmods 60

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-patch-logs
          path: ${{ env.OWRT_DIR }}/logs/**
          if-no-files-found: ignore
          retention-days: 5
