# The feeds, pinned the way scripts/pin.env pins OpenWrt.
#
# Why this file exists, MEASURED: run 39248180026, release v0.1.1-m2, 2026-10-19.
# Both firmware jobs died 69 minutes in with
#
#   ./Modules/_ctypes/_ctypes.c:119:10: fatal error: ffi.h: No such file or directory
#   ERROR: package/feeds/packages/python3 failed to build.
#
# through no change of this repository's.  openwrt/packages HEAD at that moment was
# 70ac3a84406c, "libffi: move to core repo", 2026-10-19T10:45Z -- six minutes before
# the run was dispatched.  It moved libffi into the *core* repo, and the core this
# project pins (9b95be917b28, 2026-10-02) predates that move, so the tree the build
# assembled had libffi in neither half: python3 in the feed still depends on libffi
# and libffi/host, and neither existed.  The previous day's build at the same commit
# of ours died for a different reason, later, and would have hit this too.
#
# The comment that used to sit in build-firmware.sh said the feeds "follow their own
# branch heads rather than the revision pinned in pin.env, so a rebuild months later
# picks up newer feed packages".  That is how a green release becomes red with no
# commit of ours in between.  So they are pinned.
#
# The pins are the feed state six minutes before that move: the freshest state that
# still matches the core revision.
#
# Bumping these: pick the four (five, for video) SHAs you want, run a release, and
# keep the "feed revisions in use" lines from the log.  A pin records the past.
#
# src-git <name> <url>^<commit> is the syntax OpenWrt's own scripts/feeds reads.
src-git packages https://git.openwrt.org/feed/packages.git^3b7cdf03a6f22e91ae485e1ffdda1062da7a3431
src-git luci https://git.openwrt.org/project/luci.git^0a601b651af34ae4a83dd89f417dccdc474ec348
src-git routing https://git.openwrt.org/feed/routing.git^4b9891b9136259f93294a424507ed24c5e8c1cbd
src-git telephony https://git.openwrt.org/feed/telephony.git^5d68d53c160a325ea9d03fce393e051573bcc736
src-git video https://github.com/openwrt/video.git^6917907d4d6c670cf85be525d23216595655061d
